spring.application.name=gerenciamento-despensa
server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/despensa}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:despensa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:despensa_dev_only}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
